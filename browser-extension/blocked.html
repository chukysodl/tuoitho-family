<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Tuổi Thơ</title><style>body{font-family:Segoe UI,sans-serif;background:#f5f7fb;color:#17365d;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:520px;background:white;padding:42px;border-radius:18px;box-shadow:0 12px 45px #17365d22;text-align:center}h1{font-size:28px}button{font:inherit;padding:11px 24px;border:0;border-radius:8px;background:#1e6bb8;color:#fff;cursor:pointer}</style></head><body><main class="card"><h1>Trang web này đã bị phụ huynh chặn.</h1><p id="website"></p><button type="button" onclick="history.back()">Quay lại</button></main><script>const host=new URLSearchParams(location.search).get('host');document.getElementById('website').textContent=host?'Website: '+host:'';</script></body></html>

name: Deploy remote parent dashboard

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remote-dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-dashboard-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out TASK-008 dashboard
        uses: actions/checkout@v4
        with:
          ref: task/008-remote-control

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static HTTPS dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: remote-dashboard

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4

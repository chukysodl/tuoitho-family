name: Publish Repair and Keywords test release

on:
  push:
    branches:
      - task/009c-installer-keywords
    paths:
      - '.github/workflows/publish-tamper-v2-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and validate Repair and Keywords
        shell: pwsh
        run: |
          dotnet restore TuoiTho.sln
          dotnet build TuoiTho.sln --configuration Release --no-restore
          dotnet test tests\TuoiTho.Tests\TuoiTho.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName~TamperProtectionTests|FullyQualifiedName~TimeGuardrailTests|FullyQualifiedName~ParentTimePolicyTests|FullyQualifiedName~WebPolicyTests|FullyQualifiedName~BrowserRuntimeAndContentTests"

      - name: Publish self-contained components
        shell: pwsh
        run: ./scripts/build-production.ps1

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          & $iscc "/DChromeExtensionId=" "/DEdgeExtensionId=" "installer\QuanLyThoiGian.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

      - name: Build release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts\release -Force | Out-Null
          Copy-Item artifacts\installer\QuanLyThoiGian_Setup.exe artifacts\release\QLTG_1.0.2_Repair_Keywords_Setup.exe -Force
          Copy-Item artifacts\production\QuanLyThoiGian-BrowserExtension-Store.zip artifacts\release\BrowserExtension-Store.zip -Force
          Copy-Item artifacts\production\build-info.json artifacts\release\build-info.json -Force
          Compress-Archive -Path artifacts\release\QLTG_1.0.2_Repair_Keywords_Setup.exe,artifacts\release\BrowserExtension-Store.zip,artifacts\release\build-info.json -DestinationPath artifacts\release\QLTG_1.0.2_Repair_Keywords.zip -Force

      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'repair-keywords-test-20261006'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag artifacts\release\QLTG_1.0.2_Repair_Keywords_Setup.exe artifacts\release\QLTG_1.0.2_Repair_Keywords.zip --target "${{ github.sha }}" --title "Quan ly thoi gian 1.0.2 - Repair Auth and Search Keywords" --notes "Pre-release for TASK-009C. Adds recovery for missing/corrupt parent-auth during repair, keeps Tamper Protection and time guardrails, and adds local-only blocked search keywords for YouTube and TikTok. Search queries are not sent to the Windows Service or persisted." --prerelease
